# Paste into aaPanel > Website > simpro.bkkjateng.co.id > URL Rewrite.
# Application files must be directly inside the domain document root.
# This file is included INSIDE server {}; do not wrap it in another server block.

# Physical report/comparison directories must reach the role controller too.
rewrite ^/(admin|admin_kc|direksi|kadiv_kepatuhan|kadiv_litbang|kadiv_operasional|kadiv_pemasaran|kadiv_penyelesaian_kredit|kadiv_sdm|kadiv_sekper|kepala_cabang|kepala_wilayah_banyumas|kepala_wilayah_pekalongan|kepala_wilayah_semarang|kepala_wilayah_solo|pic_area_banyumas|pic_area_pekalongan|pic_area_semarang|pic_area_solo|satker_skai)/laporan(?:/[0-9]+(?:/[a-zA-Z0-9_-]+)?)?/?$ /$1/index.php last;
rewrite ^/(admin|admin_kc|direksi|kadiv_kepatuhan|kadiv_litbang|kadiv_operasional|kadiv_pemasaran|kadiv_penyelesaian_kredit|kadiv_sdm|kadiv_sekper|kepala_cabang|kepala_wilayah_banyumas|kepala_wilayah_pekalongan|kepala_wilayah_semarang|kepala_wilayah_solo|pic_area_banyumas|pic_area_pekalongan|pic_area_semarang|pic_area_solo|satker_skai)/pembanding/?$ /$1/index.php last;

# Keep existing files/directories and direct PHP/API/print endpoints intact.
# No new query string: Nginx preserves filters and PHP reads REQUEST_URI.
if (!-e $request_filename) {
    rewrite ^/(admin|admin_kc|direksi|kadiv_kepatuhan|kadiv_litbang|kadiv_operasional|kadiv_pemasaran|kadiv_penyelesaian_kredit|kadiv_sdm|kadiv_sekper|kepala_cabang|kepala_wilayah_banyumas|kepala_wilayah_pekalongan|kepala_wilayah_semarang|kepala_wilayah_solo|pic_area_banyumas|pic_area_pekalongan|pic_area_semarang|pic_area_solo|satker_skai)/[a-zA-Z][a-zA-Z0-9_]*/?$ /$1/index.php last;
}

# Nginx does not read the .htaccess that protects local test artifacts.
location = /.local { return 404; }
location ^~ /.local/ { return 404; }
location = /tests { return 404; }
location ^~ /tests/ { return 404; }
location = /deploy { return 404; }
location ^~ /deploy/ { return 404; }
